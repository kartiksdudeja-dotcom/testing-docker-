name: Build and Deploy Payload CMS to Droplet
 
on:
  push:
    branches:
      - main
    paths:
      - 'cms/**'
      - '.github/workflows/cms-deploy.yml'
  workflow_dispatch:
 
jobs:
  build-and-deploy:
    name: Build & Deploy CMS
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push CMS Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cms
          file: ./cms/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/testtoday:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/testtoday:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/cms
 
            echo "==> Pulling latest CMS image (${{ secrets.DOCKERHUB_USERNAME }}/testtoday:latest)..."
            docker compose pull payload
 
            echo "==> Updating Payload CMS container..."
            docker compose up -d --no-deps payload
 
            echo "==> Cleaning up unused images..."
            docker image prune -f
 
            echo "==> Deployment Complete! Active containers:"
            docker compose ps